name: cXTML conformance

on: [push, pull_request]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the validator dependency
        run: python -m pip install "regex>=2024.1"
      - name: Validator mirror matches SOURCE.lock
        run: python tools/sync_validator.py
      - name: Generated spec, profiles and patch match their sources
        run: python tools/render_spec.py --check
      - name: Conformance corpus
        run: python -m unittest discover tests -v
      - name: Sanitization gate
        run: python tools/sanitize_scan.py
